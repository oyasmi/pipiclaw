name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing git tag to release, for example v0.4.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.value }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          tag="${{ steps.tag.outputs.value }}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$pkg_version" ]; then
            echo "::error::Tag $tag does not match package.json version v$pkg_version"
            exit 1
          fi

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm pack

      - name: Generate checksums
        run: sha256sum *.tgz > checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.value }}" *.tgz checksums.txt \
            --generate-notes
